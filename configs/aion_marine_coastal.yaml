# AION Marine Configuration - Coastal Navigation
# GPS-denied navigation for vessels using depth TRN and shoreline matching
# Target: CEP90 ≤ 50m near coast

common:
  frame: NED
  origin:
    lat_deg: 32.0853     # Tel Aviv coast
    lon_deg: 34.7818
    alt_m: 0.0            # Sea level
  gravity_model: wgs84

ukf:
  rate_hz: 200
  include_clock_states: true
  include_wind_states: true    # Sea state compensation
  proc_noise:
    gyro_rw: 0.03         # Higher for vessel motion
    acc_rw: 0.05          # Higher for wave action
    bg_rw: 0.001
    ba_rw: 0.001
    clk_rw: 1.0e-9
    clkd_rw: 1.0e-11
    wind_rw: 0.5          # Wind/current drift
  measurement_gates:
    nis_gate_1d: 12.0     # Looser gates for marine environment
    nis_gate_3d: 30.0

marine:
  depth_trn:
    enabled: true
    update_rate_hz: 5.0   # Depth sounder rate
    chi2_gate_1d: 9.0
    tide_model: offset    # Simple tide offset
    tide_offset_m: 0.5
    chart_path: data/charts/mediterranean
    min_depth_m: 2.0
    max_depth_m: 200.0
    sigma_m: 2.0          # Depth measurement uncertainty
    min_gradient: 0.02    # Minimum seafloor gradient
  
  shoreline_match:
    enabled: true
    update_rate_hz: 0.5   # Slow update for coastline
    radar_type: marine    # X-band marine radar
    max_range_km: 20
    min_features: 5
    chi2_gate: 15.0

trn:
  enabled: false          # No terrain for vessels

stn:
  enabled: true
  beacons_file: configs/stn/coastal_beacons.yaml
  min_beacons: 3          # Can work with fewer beacons
  sigma_tdoa_s: 3.0e-7    # Slightly worse over water
  use_doppler: true
  raim:
    enabled: true
    max_outliers: 1
  update_rate_hz: 0.5
  providers:
    - coastal_5g          # Coastal cell towers
    - ais                 # AIS from other vessels
    - loran               # If available
    - vhf_df              # VHF direction finding

baro:
  enabled: true
  update_rate_hz: 10.0    # Less critical for vessels
  sigma_m: 3.0            # Higher uncertainty at sea level
  temp_comp_factor: 0.15
  chi2_gate_1d: 12.0
  max_innovation_m: 20.0
  use_low_pass: true
  filter_time_constant: 5.0

doppler_log:
  enabled: true
  type: acoustic          # Acoustic doppler log
  update_rate_hz: 2.0
  min_depth_m: 5.0        # Minimum depth for bottom lock
  max_depth_m: 200.0
  sigma_vel_mps: 0.05
  bottom_track: true
  water_track: true       # When no bottom lock

integrity:
  enabled: true
  nees_window_s: 20       # Longer window for vessel dynamics
  nis_window_s: 20
  consistency_threshold: 0.7  # Lower threshold for marine
  mode_hysteresis_s: 5.0
  modes:
    - NOMINAL             # All aids working
    - COASTAL_ONLY        # Near shore navigation
    - OPEN_SEA            # No coastal references
    - DEGRADED

logging:
  level: info
  file: logs/aion_marine_coastal.log
  binlog_path: logs/aion_marine_coastal.bin
  log_rate_hz: 5          # Lower rate for vessel