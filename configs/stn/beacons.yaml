# STN (Signals of Opportunity) Beacon Catalog
# Terrestrial beacons for TDOA/Doppler navigation
# Tel Aviv area beacons for good GDOP geometry (centered around 32.0853, 34.7818)

beacons:
  # Ring of beacons around Tel Aviv for optimal geometry
  - id: "BKN001"
    name: "TLV-NW"
    type: "5G"
    latitude: 32.12
    longitude: 34.73
    altitude_msl: 60.0
    frequency_mhz: 3500.0
    power_dbm: 40.0
    clock_bias_sigma_m: 40.0
    tdoa_sigma_m: 25.0
    enabled: true

  - id: "BKN002"
    name: "TLV-NE"
    type: "5G"
    latitude: 32.12
    longitude: 34.83
    altitude_msl: 60.0
    frequency_mhz: 3500.0
    power_dbm: 40.0
    clock_bias_sigma_m: 40.0
    tdoa_sigma_m: 25.0
    enabled: true

  - id: "BKN003"
    name: "TLV-SE"
    type: "5G"
    latitude: 32.05
    longitude: 34.83
    altitude_msl: 40.0
    frequency_mhz: 3500.0
    power_dbm: 40.0
    clock_bias_sigma_m: 40.0
    tdoa_sigma_m: 25.0
    enabled: true

  - id: "BKN004"
    name: "TLV-SW"
    type: "5G"
    latitude: 32.05
    longitude: 34.73
    altitude_msl: 40.0
    frequency_mhz: 3500.0
    power_dbm: 40.0
    clock_bias_sigma_m: 40.0
    tdoa_sigma_m: 25.0
    enabled: true

  - id: "BKN005"
    name: "TLV-N"
    type: "UHF"
    latitude: 32.15
    longitude: 34.7818
    altitude_msl: 90.0
    frequency_mhz: 900.0
    power_dbm: 30.0
    clock_bias_sigma_m: 60.0
    tdoa_sigma_m: 40.0
    enabled: true

# Configuration parameters
config:
  min_beacons: 3              # Minimum beacons for position fix (relaxed for debugging)
  max_beacons: 8              # Maximum beacons to use (best geometry)
  gdop_threshold: 12.0        # Maximum acceptable GDOP (further relaxed for initial acceptance)
  snr_threshold_db: 6.0       # Minimum SNR for measurement (more relaxed)
  raim_enabled: true          # Receiver Autonomous Integrity Monitoring
  raim_max_outliers: 1        # Maximum outliers RAIM can handle
  update_rate_hz: 2.0         # STN update rate

# Clock parameters
clock:
  use_ocxo: true              # Use oven-controlled crystal oscillator
  drift_sigma_ppm: 0.01       # Clock drift uncertainty (parts per million)
  bias_sigma_m: 30.0          # Initial clock bias uncertainty (meters)
  max_age_s: 10.0             # Maximum age of TDOA measurement
