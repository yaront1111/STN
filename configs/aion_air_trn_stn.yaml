# AION Air Configuration - TRN + STN
# GPS-denied navigation with TRN and Signals of Opportunity
# Target: CEP90 ≤ 50m, CEP50 10-30m with good SoOP geometry

common:
  frame: NED
  origin:
    lat_deg: 31.7683     # Jerusalem
    lon_deg: 35.2137
    alt_m: 750.0          # MSL altitude
  gravity_model: wgs84

ukf:
  rate_hz: 200
  include_clock_states: true    # Required for STN TDOA
  include_wind_states: false
  proc_noise:
    gyro_rw: 0.02         # (deg/s)/√Hz
    acc_rw: 0.03          # m/s²/√Hz
    bg_rw: 0.0005         # (deg/s²)/√Hz
    ba_rw: 0.0005         # m/s³/√Hz
    clk_rw: 1.0e-9        # sec/√Hz (clock bias)
    clkd_rw: 1.0e-11      # sec/s/√Hz (clock drift)
  measurement_gates:
    nis_gate_1d: 15.0
    nis_gate_3d: 25.0

trn:
  enabled: true
  update_rate_hz: 10
  chi2_gate_1d: 12.0          # Relaxed chi-squared gate for initial acceptance
  min_slope_deg: 0.05         # Very low slope threshold for coastal/flat terrain
  min_agl_m: 2.0
  max_agl_m: 1500.0
  dem_path: data/dem/srtm
  dem_sigma_base_m: 8.0       # Increased base uncertainty for flat terrain
  dem_sigma_slope_k: 0.2      # Higher slope-dependent uncertainty
  radar_sigma_m: 2.0          # More conservative radar measurement uncertainty
  flat_terrain_mode: true     # Enable altitude-only constraint for flat areas

stn:
  enabled: true
  beacons_file: configs/stn/beacons.yaml
  min_beacons: 4
  sigma_tdoa_s: 2.0e-7    # ~60m equivalent
  use_doppler: true
  raim:
    enabled: true
    max_outliers: 1
    threshold: 6.0
  update_rate_hz: 1.0     # STN fixes at 1 Hz
  providers:
    - leo               # LEO satellites
    - terrestrial       # Ground beacons
    - 5g                # 5G towers
    - uwb               # UWB anchors if available

baro:
  enabled: true
  update_rate_hz: 50.0
  sigma_m: 1.5
  temp_comp_factor: 0.1
  chi2_gate_1d: 9.0
  max_innovation_m: 10.0
  use_low_pass: true
  filter_time_constant: 2.0

radar_odom:
  enabled: true
  rate_hz: 10
  type: mmwave          # mmwave or marine
  robust_loss: huber
  max_range_m: 200
  min_points: 50
  icp_max_iter: 20
  icp_tolerance: 0.01

integrity:
  enabled: true
  nees_window_s: 10
  nis_window_s: 10
  consistency_threshold: 0.8
  mode_hysteresis_s: 2.0
  modes:
    - NOMINAL          # All aids working
    - TRN_ONLY         # STN unavailable
    - STN_ONLY         # Flat terrain
    - DEGRADED         # Limited aids

logging:
  level: info
  file: logs/aion_air_trn_stn.log
  binlog_path: logs/aion_air_trn_stn.bin
  log_rate_hz: 10