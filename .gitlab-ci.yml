stages:
  - lint
  - build
  - test
  - deploy

variables:
  GIT_DEPTH: "10"
  DEBIAN_FRONTEND: noninteractive
  CC: gcc-11
  CXX: g++-11

image: ubuntu:22.04

before_script:
  - apt-get update -qq
  - apt-get install -y --no-install-recommends
    build-essential cmake git ca-certificates
    libeigen3-dev libyaml-cpp-dev libspdlog-dev
    libprotobuf-dev protobuf-compiler
    libgtest-dev libgmock-dev
    python3-pip clang-format-14
  - pip3 install --break-system-packages pre-commit pyyaml numpy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - build/
    - .cache/

# Linting stage
lint:code:
  stage: lint
  script:
    - pre-commit run --all-files
  only:
    - merge_requests
    - main

# Build stages
build:debug:
  stage: build
  script:
    - mkdir -p build-debug
    - cd build-debug
    - cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON ..
    - make -j$(nproc)
  artifacts:
    paths:
      - build-debug/
    expire_in: 1 day

build:release:
  stage: build
  script:
    - mkdir -p build-release
    - cd build-release
    - cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON ..
    - make -j$(nproc)
  artifacts:
    paths:
      - build-release/
    expire_in: 1 week

# Test stages
test:unit:
  stage: test
  needs: ["build:debug"]
  script:
    - cd build-debug
    - ctest --output-on-failure -R "^test_"
  artifacts:
    reports:
      junit: build-debug/test_results.xml
    when: on_failure
    paths:
      - build-debug/Testing/

test:integration:
  stage: test
  needs: ["build:release"]
  script:
    - cd build-release
    - ctest --output-on-failure -R "^integration_"
  artifacts:
    when: on_failure
    paths:
      - build-release/logs/
      - build-release/Testing/

test:coverage:
  stage: test
  needs: ["build:debug"]
  script:
    - apt-get install -y gcovr
    - cd build-debug
    - ctest --output-on-failure
    - gcovr --xml-pretty --exclude-unreachable-branches --print-summary -o coverage.xml --root ${CI_PROJECT_DIR}
  coverage: /^\s*lines:\s*\d+.\d+\%/
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build-debug/coverage.xml

# Deploy stage
deploy:docker:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -f docker/Dockerfile.runtime -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - tags