# KISS-ICP Parameters for ORION

/**:
  ros__parameters:
    # Input/Output topics
    input_topic: "/lidar/points"
    output_topic: "/odom/lidar"

    # Frame IDs
    base_frame: "base_link"
    odom_frame: "odom"

    # KISS-ICP Algorithm Parameters
    # (These will be passed to actual KISS-ICP library in Week 3-4)
    voxel_size: 0.5                    # Downsampling voxel size (meters)
    max_range: 100.0                   # Maximum LiDAR range to consider (meters)
    min_range: 1.0                     # Minimum LiDAR range (meters)
    deskew: false                      # Motion compensation (needs IMU integration)
    max_points_per_voxel: 20          # Voxelization parameter
    initial_threshold: 2.0             # Initial correspondence threshold
    min_motion_th: 0.1                 # Minimum motion to trigger new keyframe (meters)
